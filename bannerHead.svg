<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="55%" stop-color="#0d1420"/>
      <stop offset="100%" stop-color="#111a2b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a2540" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0e17" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#2a3550" opacity="0.55"/>
    </pattern>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect x="0" y="0" width="220" height="220" fill="url(#dots)"/>
  <rect x="960" y="0" width="240" height="480" fill="url(#dots)" opacity="0.5"/>
  <path d="M0,0 L480,0 L280,480 L0,480 Z" fill="url(#glow)"/>

  <!-- accent line (pulsing) -->
  <rect x="70" y="150" width="46" height="4" fill="#f59e0b">
    <animate attributeName="width" values="46;70;46" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Name (fade + rise in) -->
  <text x="68" y="215" font-family="Georgia, 'Trebuchet MS', Arial, sans-serif" font-size="58" font-weight="700" fill="#f2f4f8" opacity="0">
    Ostap <tspan fill="#f59e0b">Rapavyi</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0,15" to="0,0" begin="0.1s" dur="1s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text x="70" y="252" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="4" font-weight="600" fill="#c7cede">
    SENIOR PYTHON FULL-STACK ENGINEER
  </text>

  <!-- Description -->
  <text x="70" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9aa4bd">
    Building scalable, reliable and high-performance
  </text>
  <text x="70" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9aa4bd">
    web applications and SaaS products.
  </text>

  <!-- Tech icon strip -->
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Python -->
    <g transform="translate(70,360)">
      <circle cx="24" cy="0" r="24" fill="#132038"/>
      <path d="M17 -10 h6 a5 5 0 0 1 5 5 v4 h-11 v2 h15 a5 5 0 0 1 5 5 v6 a5 5 0 0 1 -5 5 h-4 v-4 a3 3 0 0 0 -3 -3 h-8 a5 5 0 0 1 -5 -5 v-4 a5 5 0 0 1 5 -5 z" fill="#4B8BBE" transform="translate(0,-2) scale(0.85)"/>
      <path d="M31 10 h-6 a5 5 0 0 1 -5 -5 v-4 h11 v-2 h-15 a5 5 0 0 1 -5 -5 v-6 a5 5 0 0 1 5 -5 h4 v4 a3 3 0 0 0 3 3 h8 a5 5 0 0 1 5 5 v4 a5 5 0 0 1 -5 5 z" fill="#FFD43B" transform="translate(0,2) scale(0.85)"/>
      <text x="24" y="55" font-size="16" fill="#dfe4ee" text-anchor="middle">Python</text>
    </g>

    <line x1="182" y1="336" x2="182" y2="384" stroke="#2a3550" stroke-width="2"/>

    <!-- Django -->
    <g transform="translate(210,360)">
      <circle cx="24" cy="0" r="24" fill="#132038"/>
      <text x="24" y="7" font-size="22" font-weight="700" fill="#0C4B33" text-anchor="middle">dj</text>
      <text x="24" y="55" font-size="16" fill="#dfe4ee" text-anchor="middle">Django</text>
    </g>

    <line x1="322" y1="336" x2="322" y2="384" stroke="#2a3550" stroke-width="2"/>

    <!-- FastAPI -->
    <g transform="translate(350,360)">
      <circle cx="24" cy="0" r="24" fill="#009485"/>
      <path d="M22 -14 l-9 16 h7 l-3 12 12 -17 h-7 z" fill="#ffffff"/>
      <text x="24" y="55" font-size="16" fill="#dfe4ee" text-anchor="middle">FastAPI</text>
    </g>

    <line x1="462" y1="336" x2="462" y2="384" stroke="#2a3550" stroke-width="2"/>

    <!-- React -->
    <g transform="translate(490,360)">
      <circle cx="24" cy="0" r="24" fill="#132038"/>
      <g stroke="#61DAFB" fill="none" stroke-width="2.2">
        <ellipse cx="24" cy="0" rx="18" ry="7"/>
        <ellipse cx="24" cy="0" rx="18" ry="7" transform="rotate(60 24 0)"/>
        <ellipse cx="24" cy="0" rx="18" ry="7" transform="rotate(120 24 0)"/>
      </g>
      <circle cx="24" cy="0" r="3.2" fill="#61DAFB"/>
      <text x="24" y="55" font-size="16" fill="#dfe4ee" text-anchor="middle">React</text>
    </g>

    <line x1="602" y1="336" x2="602" y2="384" stroke="#2a3550" stroke-width="2"/>

    <!-- AWS -->
    <g transform="translate(630,360)">
      <circle cx="24" cy="0" r="24" fill="#132038"/>
      <text x="24" y="7" font-size="19" font-weight="700" fill="#FF9900" text-anchor="middle">aws</text>
      <path d="M11 10 q13 8 26 0" stroke="#FF9900" stroke-width="2" fill="none"/>
      <text x="24" y="55" font-size="16" fill="#dfe4ee" text-anchor="middle">AWS</text>
    </g>

    <line x1="742" y1="336" x2="742" y2="384" stroke="#2a3550" stroke-width="2"/>

    <!-- AI -->
    <g transform="translate(770,360)">
      <circle cx="24" cy="0" r="24" fill="#132038"/>
      <rect x="12" y="-12" width="24" height="24" rx="4" fill="none" stroke="#8b7bf0" stroke-width="2"/>
      <circle cx="24" cy="0" r="5" fill="#8b7bf0"/>
      <text x="24" y="55" font-size="16" fill="#dfe4ee" text-anchor="middle">AI</text>
    </g>
  </g>

  <!-- Laptop mockup -->
  <g transform="translate(870,90)">
    <circle cx="150" cy="150" r="220" fill="url(#screenGlow)"/>
    <rect x="20" y="20" width="290" height="190" rx="10" fill="#0d1424" stroke="#2a3550" stroke-width="2"/>
    <rect x="30" y="42" width="270" height="158" rx="4" fill="#060a13"/>
    <circle cx="40" cy="30" r="3" fill="#ff5f56"/>
    <circle cx="50" cy="30" r="3" fill="#ffbd2e"/>
    <circle cx="60" cy="30" r="3" fill="#27c93f"/>

    <text x="42" y="62" font-family="Consolas, Menlo, monospace" font-size="10" fill="#7dd3fc">from fastapi import FastAPI, Depends</text>
    <text x="42" y="76" font-family="Consolas, Menlo, monospace" font-size="10" fill="#c084fc">from</text>
    <text x="68" y="76" font-family="Consolas, Menlo, monospace" font-size="10" fill="#a5b4fc">sqlalchemy.ext.asyncio</text>
    <text x="180" y="76" font-family="Consolas, Menlo, monospace" font-size="10" fill="#c084fc">import</text>
    <text x="42" y="90" font-family="Consolas, Menlo, monospace" font-size="10" fill="#a5b4fc">app = FastAPI(title="Backend API")</text>
    <text x="42" y="112" font-family="Consolas, Menlo, monospace" font-size="10" fill="#34d399">@app.get("/health")</text>
    <text x="42" y="126" font-family="Consolas, Menlo, monospace" font-size="10" fill="#c084fc">async def</text>
    <text x="98" y="126" font-family="Consolas, Menlo, monospace" font-size="10" fill="#facc15">health():</text>
    <text x="56" y="140" font-family="Consolas, Menlo, monospace" font-size="10" fill="#e2e8f0">return {"status": "ok"}</text>
    <text x="42" y="162" font-family="Consolas, Menlo, monospace" font-size="10" fill="#34d399">@app.post("/items")</text>
    <text x="42" y="176" font-family="Consolas, Menlo, monospace" font-size="10" fill="#e2e8f0">db_item = Item(**item.dict())</text>
    <text x="42" y="190" font-family="Consolas, Menlo, monospace" font-size="10" fill="#e2e8f0">await db.commit()</text>
    <rect x="150" y="182" width="6" height="11" fill="#7dd3fc">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="210" width="330" height="14" rx="4" fill="#1a2338" stroke="#2a3550"/>
  </g>
</svg>
